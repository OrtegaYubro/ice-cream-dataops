name: Deploy Toolkit

on:
  push:
    branches:
      - main
    paths:
      - "ice-cream-dataops/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Pick one"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - prod

jobs:
  build-modules:
    name: Build & Deploy
    runs-on: ubuntu-latest
    container:
      image: cognite/toolkit:0.6.53

    strategy:
      matrix:
        include:
          - environment: ${{ inputs.environment != '' && inputs.environment || 'test' }}

    environment: ${{ matrix.environment }}

    env:
      CDF_PROJECT: cdf-bootcamp-15-${{ matrix.environment }}
      CDF_CLUSTER: westeurope-1
      IDP_TENANT_ID: 16e3985b-ebe8-4e24-9da4-933e21a9fc81
      IDP_TOKEN_URL: https://login.microsoftonline.com/16e3985b-ebe8-4e24-9da4-933e21a9fc81/oauth2/v2.0/token
      LOGIN_FLOW: client_credentials

      IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}

      DATA_DEVELOPER_SOURCE_ID: ${{ vars.DATA_DEVELOPER_SOURCE_ID }}

      DATA_PIPELINE_OEE_CLIENT_ID: ${{ vars.DATA_PIPELINE_OEE_CLIENT_ID }}
      DATA_PIPELINE_OEE_CLIENT_SECRET: ${{ secrets.DATA_PIPELINE_OEE_CLIENT_SECRET }}
      DATA_PIPELINE_OEE_SOURCE_ID: ${{ vars.DATA_PIPELINE_OEE_SOURCE_ID }}

      ICAPI_EXTRACTORS_CLIENT_ID: ${{ vars.ICAPI_EXTRACTORS_CLIENT_ID }}
      ICAPI_EXTRACTORS_CLIENT_SECRET: ${{ secrets.ICAPI_EXTRACTORS_CLIENT_SECRET }}
      ICAPI_EXTRACTORS_SOURCE_ID: ${{ vars.ICAPI_EXTRACTORS_SOURCE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Clean residual environment files
        run: |
          rm -f .env .env.* ice-cream-dataops/.env /root/.env /tmp/.env 2>/dev/null || true

      - name: Verify and Update Toolkit Authorization
        run: |
          find / -name ".env*" -not -path "/proc/*" -not -path "/sys/*" -delete 2>/dev/null || true
          touch .env
          chmod 444 .env
          yes | cdf auth verify || echo "Auth verify reportó advertencia, continuando con build y deploy..."

      - name: Build Toolkit Configurations
        run: cdf build --env=${{ matrix.environment }}

      - name: Remove unpermitted manifests from build
        run: |
          # 1. Eliminar grupos
          find build -type f \( -name "*group*.yaml" -o -name "*group*.yml" \) -delete 2>/dev/null || true
          find build -type d -name "groups" -exec rm -rf {} + 2>/dev/null || true
          find build -type d -name "auth" -exec rm -rf {} + 2>/dev/null || true

          # 2. Eliminar datasets
          find build -type f \( -name "*dataset*.yaml" -o -name "*data_set*.yaml" \) -delete 2>/dev/null || true
          find build -type d -name "datasets" -exec rm -rf {} + 2>/dev/null || true
          find build -type d -name "data_sets" -exec rm -rf {} + 2>/dev/null || true

          # 3. Eliminar espacios
          find build -type f \( -name "*space*.yaml" -o -name "*space*.yml" \) -delete 2>/dev/null || true
          find build -type d -name "spaces" -exec rm -rf {} + 2>/dev/null || true

          # 4. Eliminar funciones
          find build -type f \( -name "*function*.yaml" -o -name "*function*.yml" \) -delete 2>/dev/null || true
          find build -type d -name "functions" -exec rm -rf {} + 2>/dev/null || true
          
      - name: Deploy Toolkit Configurations
        run: cdf deploy --env=${{ matrix.environment }}