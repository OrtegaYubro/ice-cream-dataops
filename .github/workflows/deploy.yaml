name: Deploy Toolkit
on:
  push:
    branches:
      - main
    paths:
      - ice-cream-dataops/**  # Make sure this matches default_organization_dir in cdf.toml
  workflow_dispatch:
    inputs:
      environment:
        description: Pick one
        required: false
        type: choice
        options:
          - test
          - prod

jobs:
  build-modules:
    name: Build & Deploy
    runs-on: ubuntu-latest
    container:
      image: cognite/toolkit:0.6.53  # Make sure the toolkit version matches the version in cdf.toml
    strategy:
      matrix:
        include:
          # Deploy to 'test' environment automatically, only on push to main branch
          - environment: ${{ inputs.environment != '' && inputs.environment || 'test' }}

    environment: ${{ matrix.environment }}
    env:
      # Cognite Toolkit environment variables
      CDF_PROJECT: cdf-bootcamp-15-${{ matrix.environment }}

      CDF_CLUSTER: westeurope-1
      IDP_TENANT_ID: 16e3985b-ebe8-4e24-9da4-933e21a9fc81
      IDP_TOKEN_URL: https://login.microsoftonline.com/16e3985b-ebe8-4e24-9da4-933e21a9fc81/oauth2/v2.0/token
      LOGIN_FLOW: client_credentials

      IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}

      # This project's environment variables
      DATA_DEVELOPER_SOURCE_ID: ${{ vars.DATA_DEVELOPER_SOURCE_ID }}

      DATA_PIPELINE_OEE_CLIENT_ID: ${{ vars.DATA_PIPELINE_OEE_CLIENT_ID }}
      DATA_PIPELINE_OEE_CLIENT_SECRET: ${{ secrets.DATA_PIPELINE_OEE_CLIENT_SECRET }}
      DATA_PIPELINE_OEE_SOURCE_ID: ${{ vars.DATA_PIPELINE_OEE_SOURCE_ID }}

      ICAPI_EXTRACTORS_CLIENT_ID: ${{ vars.ICAPI_EXTRACTORS_CLIENT_ID }}
      ICAPI_EXTRACTORS_CLIENT_SECRET: ${{ secrets.ICAPI_EXTRACTORS_CLIENT_SECRET }}
      ICAPI_EXTRACTORS_SOURCE_ID: ${{ vars.ICAPI_EXTRACTORS_SOURCE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Clean residual environment files
        run: |
          rm -f .env .env.* ice-cream-dataops/.env /root/.env /tmp/.env 2>/dev/null || true

      - name: Verify and Update Toolkit Authorization
        run: |
          # 1. Eliminar cualquier archivo .env residual en el workspace
          find . -name "*.env*" -not -path "*/.*" -delete 2>/dev/null || true
          rm -f .env .env.* ice-cream-dataops/.env 2>/dev/null || true

          # 2. Diagnóstico directo de autenticación y proyectos usando Python
          python3 - << 'EOF'
          import os, json, urllib.request, urllib.parse

          token_url = os.environ.get("IDP_TOKEN_URL")
          client_id = os.environ.get("IDP_CLIENT_ID")
          client_secret = os.environ.get("IDP_CLIENT_SECRET")
          cluster = os.environ.get("CDF_CLUSTER")
          target_project = os.environ.get("CDF_PROJECT")

          print(f"--> Diagnosticando para proyecto objetivo: {target_project}")
          print(f"--> Client ID inyectado: {client_id}")

          # Solicitar Token
          data = urllib.parse.urlencode({
              "client_id": client_id,
              "client_secret": client_secret,
              "scope": f"https://{cluster}.cognitedata.com/.default",
              "grant_type": "client_credentials"
          }).encode("utf-8")

          try:
              req = urllib.request.Request(token_url, data=data, method="POST")
              with urllib.request.urlopen(req) as resp:
                  token_res = json.loads(resp.read().decode("utf-8"))
                  token = token_res.get("access_token")
                  print("--> Token de Azure AD obtenido exitosamente.")
          except Exception as e:
              print(f"--> ERROR al obtener token de Azure: {e}")
              exit(1)

          # Consultar proyectos visibles en Cognite Data Fusion
          api_url = f"https://{cluster}.cognitedata.com/api/v1/projects"
          req_cdf = urllib.request.Request(api_url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req_cdf) as resp_cdf:
                  cdf_res = json.loads(resp_cdf.read().decode("utf-8"))
                  projs = [p.get("urlName") for p in cdf_res.get("items", [])]
                  print(f"--> PROYECTOS VISIBLES EN CDF SEGÚN ESTE RUNNER: {projs}")
          except Exception as e:
              print(f"--> ERROR al consultar proyectos de CDF: {e}")
          EOF

          echo ""
          echo "Ejecutando cdf auth verify..."
          yes | cdf auth verify

      - name: Build Toolkit Configurations
        run: cdf build --env=${{ matrix.environment }}

      - name: Deploy Toolkit Configurations
        run: cdf deploy --env=${{ matrix.environment }}